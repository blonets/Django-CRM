version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      APP_DB_PASSWORD: ${SERVICE_PASSWORD_APP_DB_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sh:/docker-entrypoint-initdb.d/init-rls-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SERVICE_HEX_32_DJANGO_SECRET}
      DEBUG: "False"
      ENV_TYPE: production
      ALLOWED_HOSTS: ${SERVICE_FQDN_BACKEND},backend,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${SERVICE_FQDN_BACKEND}
      DOMAIN_NAME: https://${SERVICE_FQDN_BACKEND}
      DBNAME: crm_db
      DBUSER: crm_user
      DBPASSWORD: ${SERVICE_PASSWORD_APP_DB_USER}
      DBHOST: db
      DBPORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOW_ALL: "False"
      CORS_ALLOWED_ORIGINS: https://${SERVICE_FQDN_FRONTEND}
      PUBLIC_DJANGO_API_URL: https://${SERVICE_FQDN_BACKEND}
      DEFAULT_FROM_EMAIL: noreply@${SERVICE_FQDN_BACKEND}
      ADMIN_EMAIL: admin@${SERVICE_FQDN_BACKEND}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      PUBLIC_SENTRY_DSN: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bottlecrm-backend.rule=Host(`${SERVICE_FQDN_BACKEND}`)"
      - "traefik.http.routers.bottlecrm-backend.entryPoints=http,https"
      - "traefik.http.services.bottlecrm-backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SERVICE_HEX_32_DJANGO_SECRET}
      DEBUG: "False"
      ENV_TYPE: production
      DBNAME: crm_db
      DBUSER: crm_user
      DBPASSWORD: ${SERVICE_PASSWORD_APP_DB_USER}
      DBHOST: db
      DBPORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /app/.venv/bin/celery -A crm worker --loglevel=info
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SERVICE_HEX_32_DJANGO_SECRET}
      DEBUG: "False"
      ENV_TYPE: production
      DBNAME: crm_db
      DBUSER: crm_user
      DBPASSWORD: ${SERVICE_PASSWORD_APP_DB_USER}
      DBHOST: db
      DBPORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /app/.venv/bin/celery -A crm beat --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PUBLIC_DJANGO_API_URL: https://${SERVICE_FQDN_BACKEND}
      ORIGIN: https://${SERVICE_FQDN_FRONTEND}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bottlecrm-frontend.rule=Host(`${SERVICE_FQDN_FRONTEND}`)"
      - "traefik.http.services.bottlecrm-frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"

volumes:
  postgres_data:
