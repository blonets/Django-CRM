version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: postgres
      # Coolify generates this once and reuses it wherever this ID appears
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      # The application DB user's password — passed to the init script below
      APP_DB_PASSWORD: ${SERVICE_PASSWORD_APP_DB_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sh:/docker-entrypoint-initdb.d/init-rls-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # No ports: Coolify/Traefik handle internal routing

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Django — all secrets generated by Coolify
      SECRET_KEY: ${SERVICE_HEX_32_DJANGO_SECRET}
      DEBUG: "False"
      ENV_TYPE: production
      ALLOWED_HOSTS: ${SERVICE_FQDN_BACKEND},backend,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${SERVICE_FQDN_BACKEND}
      DOMAIN_NAME: ${SERVICE_FQDN_BACKEND}

      # Database — same password ID as the db service, so they always match
      DBNAME: crm_db
      DBUSER: crm_user
      DBPASSWORD: ${SERVICE_PASSWORD_APP_DB_USER}
      DBHOST: db
      DBPORT: "5432"

      # Celery / Redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # CORS
      CORS_ALLOW_ALL: "False"
      CORS_ALLOWED_ORIGINS: https://${SERVICE_FQDN_FRONTEND}

      # Frontend
      PUBLIC_DJANGO_API_URL: https://${SERVICE_FQDN_BACKEND}

      # Email
      DEFAULT_FROM_EMAIL: noreply@${SERVICE_FQDN_BACKEND}
      ADMIN_EMAIL: admin@${SERVICE_FQDN_BACKEND}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}

      # Google OAuth (leave blank to disable)
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""

      # Sentry (leave blank to disable)
      PUBLIC_SENTRY_DSN: ""
    volumes:
      - ./backend:/app
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bottlecrm-backend.rule=Host(`${SERVICE_FQDN_BACKEND}`)"
      - "traefik.http.routers.bottlecrm-backend.entryPoints=http,https"
      - "traefik.http.services.bottlecrm-backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SERVICE_HEX_32_DJANGO_SECRET}
      DEBUG: "False"
      ENV_TYPE: production
      DBNAME: crm_db
      DBUSER: crm_user
      DBPASSWORD: ${SERVICE_PASSWORD_APP_DB_USER}
      DBHOST: db
      DBPORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "/app/.venv/bin/celery -A crm worker --loglevel=info"
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SERVICE_HEX_32_DJANGO_SECRET}
      DEBUG: "False"
      ENV_TYPE: production
      DBNAME: crm_db
      DBUSER: crm_user
      DBPASSWORD: ${SERVICE_PASSWORD_APP_DB_USER}
      DBHOST: db
      DBPORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "/app/.venv/bin/celery -A crm beat --loglevel=info"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      PUBLIC_DJANGO_API_URL: https://${SERVICE_FQDN_BACKEND}
      ORIGIN: https://${SERVICE_FQDN_FRONTEND}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bottlecrm-frontend.rule=Host(`${SERVICE_FQDN_FRONTEND}`)"
      - "traefik.http.services.bottlecrm-frontend.loadbalancer.server.port=5181"
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5181/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  frontend_node_modules: